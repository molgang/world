name: MOLGANG Assets & OTAP Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify asset manifest
        run: |
          python tools/build_asset_manifest.py
          git diff --exit-code -- assets/manifest.json
      - name: Verify tracked binary assets
        run: |
          test -s MOLGANG_OTAP_Test.rbxl
          test "$(find assets/models -type f \( -name '*.fbx' -o -name '*.glb' \) | wc -l)" -gt 0
          git lfs ls-files

  web-sync-guards:
    # SYNC.md Rule 2 — previously only ever run manually/locally, never
    # gated in CI (found during the MOLGANG-symbiose migration: nothing
    # here caught a real drifted file in assets/steelworks/data until this
    # job was added). Runs the Lua<->JSON, garden-economy, world-grounding,
    # and knitweb-sync drift guards together so PRs can't silently regress.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: moleculia.json matches the Lua source
        run: python3 assets/world/moleculia_gen.py --check
      - name: world_smoke (data + Lua-parity asserts)
        run: python3 assets/world/world_smoke.py
      - name: assets/{viscosity,steelworks,rivierlab} match vendor/knitweb
        run: python3 assets/world/sync_from_knitweb.py --check
      - name: Playwright deps
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Deploy bundle builds + garden_smoke (browser guard)
        run: |
          bash assets/world/build_deploy.sh
          python3 assets/world/garden_smoke.py
